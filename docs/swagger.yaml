info:
  contact: {}
paths:
  /api/application/identidade/auth/login:
    post:
      consumes:
      - application/json
      description: 'Login com e-mail/senha contra a organization resolvida pelo Host
        (subdomínio de workspace ou domínio custom). Falhas são indistinguíveis: usuário
        inexistente, senha errada e host sem organization devolvem o mesmo 401 genérico.
        Com Redis ligado, repetidas falhas do par e-mail+IP aplicam lockout temporário
        (429)'
      parameters:
      - description: Credenciais
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessaoResponseDto'
        "400":
          description: Corpo malformado
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "401":
          description: Credenciais inválidas (genérico)
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "429":
          description: Muitas tentativas — login bloqueado temporariamente
          schema:
            $ref: '#/definitions/rest_err.RestErr'
      summary: Autentica e abre uma sessão
      tags:
      - Identidade · Auth
  /api/application/identidade/auth/logout:
    post:
      consumes:
      - application/json
      description: 'Revoga o refresh token no Postgres (marca revogado_em; a linha
        nunca é removida). Idempotente: repetir com token já revogado é sucesso —
        só assinatura/tipo/claims inválidos recusam.'
      parameters:
      - description: Refresh token a revogar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.TokenRequestDto'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Corpo malformado
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "401":
          description: Sessão inválida ou expirada
          schema:
            $ref: '#/definitions/rest_err.RestErr'
      summary: Encerra a sessão
      tags:
      - Identidade · Auth
  /api/application/identidade/auth/refresh:
    post:
      consumes:
      - application/json
      description: Troca um refresh token válido por um novo par de tokens; o jti
        precisa seguir ativo no Postgres (revogação persistida)
      parameters:
      - description: Refresh token vigente
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.TokenRequestDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessaoResponseDto'
        "400":
          description: Corpo malformado
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "401":
          description: Sessão inválida ou expirada
          schema:
            $ref: '#/definitions/rest_err.RestErr'
      summary: Renova a sessão
      tags:
      - Identidade · Auth
  /api/application/identidade/catalogo/permissoes/minhas:
    get:
      description: Devolve a árvore dominio → subdominio → ações JÁ FILTRADA pelas
        permissões efetivas do usuário no workspace ativo — o front monta menu/botões
        sem hardcode de regra. super_admin recebe a árvore inteira
      parameters:
      - description: UUID do workspace (fallback quando o host não tem subdomínio)
        in: header
        name: X-Workspace-Id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalogo.ArvoreResponseDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest_err.RestErr'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Lista as permissões do usuário autenticado
      tags:
      - Identidade · Catálogo
  /api/application/identidade/logs/acesso:
    get:
      description: Lista paginada das requisições registradas no recorte do chamador
        (mesmas regras da trilha de auditoria). Filtros fora do recorte respondem
        404; ClickHouse ausente responde 503 padronizado
      parameters:
      - description: UUID do workspace (fallback quando o host não tem subdomínio)
        in: header
        name: X-Workspace-Id
        type: string
      - description: Página (default 1)
        in: query
        name: page
        type: integer
      - description: Itens por página (teto 100)
        in: query
        name: pageSize
        type: integer
      - description: UUID da organization (só tem efeito para super_admin)
        in: query
        name: organization_uuid
        type: string
      - description: UUID do workspace
        in: query
        name: workspace_uuid
        type: string
      - description: UUID do usuário autenticado na requisição original
        in: query
        name: user_uuid
        type: string
      - description: Correlação por requisição
        in: query
        name: ray_trace
        type: string
      - description: Instante inicial (RFC3339 UTC)
        in: query
        name: inicio
        type: string
      - description: Instante final (RFC3339 UTC)
        in: query
        name: fim
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pagination.Response-logs_AcessoItemDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/rest_err.RestErr'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/rest_err.RestErr'
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Consulta a trilha de acesso HTTP
      tags:
      - Identidade · Logs
  /api/application/identidade/logs/auditoria:
    get:
      description: 'Lista paginada das escritas auditadas no recorte do chamador:
        super_admin lê qualquer organization, quem tem identidade:logs:ler_organization
        lê a própria organization inteira e os demais lêem só o workspace resolvido.
        Filtros fora do recorte respondem 404; ClickHouse ausente responde 503 padronizado'
      parameters:
      - description: UUID do workspace (fallback quando o host não tem subdomínio)
        in: header
        name: X-Workspace-Id
        type: string
